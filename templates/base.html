<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shelfwise Library{% endblock %}</title>
    <style>
        :root { color-scheme: light; --ink: #182b30; --muted: #53696d; --paper: #f2f8f6; --teal: #087e8b; --teal-deep: #10444b; --coral: #e85d3f; --sun: #f4c95d; --line: #c9d9d8; --error: #9b3434; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; color: var(--ink); background-color: var(--paper); background-image: linear-gradient(115deg, rgba(255,255,255,.82), transparent 60%), repeating-linear-gradient(0deg, transparent 0, transparent 39px, rgba(8,126,139,.045) 40px); font: 16px/1.55 "Trebuchet MS", "Segoe UI", sans-serif; }
        a { color: inherit; }
        .topbar { position: sticky; top: 0; z-index: 2; min-height: 76px; padding: 0 6vw; display: flex; align-items: center; justify-content: space-between; border-bottom: 5px solid var(--coral); background: var(--teal-deep); box-shadow: 0 8px 24px rgba(16,68,75,.2); }
        .brand { color: #f2f8f6; text-decoration: none; font: bold 1.22rem/1.2 "Trebuchet MS", "Segoe UI", sans-serif; }
        .brand span { color: var(--sun); }
        .top-actions { display: flex; align-items: center; gap: 20px; font: bold .9rem/1.3 "Trebuchet MS", "Segoe UI", sans-serif; }
        .top-actions a { color: #f2f8f6; text-decoration: none; transition: color .18s ease; }
        .top-actions a:hover { color: var(--sun); }
        .top-actions .button.secondary { border-color: var(--sun); background: var(--sun); color: var(--teal-deep); }
        .top-actions .button.secondary:hover { border-color: #ffdc7a; background: #ffdc7a; }
        .page { width: min(1080px, 88vw); margin: 0 auto; padding: 70px 0 96px; }
        .eyebrow { margin: 0 0 16px; color: var(--teal); text-transform: uppercase; font: bold .78rem/1.4 "Trebuchet MS", "Segoe UI", sans-serif; }
        h1, h2 { margin: 0; color: var(--teal-deep); font-family: Georgia, "Times New Roman", serif; font-weight: normal; line-height: 1.08; text-wrap: balance; }
        h1 { font-size: 3.8rem; }
        h1::after { content: ""; display: block; width: 76px; height: 7px; margin-top: 19px; background: var(--coral); }
        h2 { font-size: 2rem; }
        .intro { max-width: 590px; margin: 24px 0 0; padding: 3px 0 3px 16px; border-left: 4px solid var(--sun); color: var(--muted); font-size: 1.08rem; }
        .button { min-height: 48px; padding: 13px 22px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--teal); border-radius: 3px; background: var(--teal); color: white; text-decoration: none; cursor: pointer; font: bold .9rem/1.2 "Trebuchet MS", "Segoe UI", sans-serif; box-shadow: 4px 4px 0 rgba(16,68,75,.16); transition: background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease; }
        .button:hover { transform: translate(2px, 2px); border-color: var(--teal-deep); background: var(--teal-deep); box-shadow: 2px 2px 0 rgba(16,68,75,.16); }
        .button.secondary { border-color: var(--coral); background: transparent; color: var(--coral); box-shadow: none; }
        .button.secondary:hover { background: #fff0e9; }
        .button:focus-visible, a:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
        .actions { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 34px; }
        .panel { width: min(510px, 100%); margin-top: 34px; padding: 32px; border: 2px solid var(--teal-deep); border-left: 8px solid var(--coral); border-radius: 3px; background: #fff; box-shadow: 9px 9px 0 rgba(8,126,139,.12); }
        .panel h1 { font-size: 2.35rem; }
        .panel h1::after { width: 52px; height: 5px; margin-top: 14px; }
        form { margin-top: 24px; }
        label { display: block; margin: 18px 0 7px; color: var(--teal-deep); font: bold .86rem/1.3 "Trebuchet MS", "Segoe UI", sans-serif; }
        input { width: 100%; min-height: 47px; padding: 11px 13px; border: 2px solid var(--line); border-radius: 2px; background: #f9fcfb; color: var(--ink); font: 1rem "Trebuchet MS", "Segoe UI", sans-serif; transition: border-color .18s ease, box-shadow .18s ease, background .18s ease; }
        input:focus { border-color: var(--teal); outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(8,126,139,.16); }
        .panel form .button { width: 100%; margin-top: 25px; }
        .subtle { margin-top: 21px; color: var(--muted); font: .9rem/1.5 "Trebuchet MS", "Segoe UI", sans-serif; }
        .subtle a { color: var(--teal); font-weight: bold; }
        .flash { margin: 18px 0 0; padding: 13px 16px; border: 2px solid #e7b7a9; border-left: 7px solid var(--error); background: #fff1ed; color: #762b2b; font: .9rem/1.4 "Trebuchet MS", "Segoe UI", sans-serif; }
        .flash.success { border-color: #b9d9cb; border-left-color: var(--teal); background: #e8f5ef; color: var(--teal-deep); }
        .table-wrap { margin-top: 30px; overflow-x: auto; border: 2px solid var(--teal-deep); border-radius: 3px; background: #fff; box-shadow: 8px 8px 0 rgba(8,126,139,.12); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px 17px; border-bottom: 1px solid var(--line); white-space: nowrap; }
        th { background: var(--teal-deep); color: white; font: bold .78rem "Trebuchet MS", "Segoe UI", sans-serif; text-transform: uppercase; }
        td { font-size: .96rem; }
        tbody tr { transition: background .15s ease; }
        tbody tr:nth-child(even) { background: #eef6f4; }
        tbody tr:hover { background: #fff2d1; }
        tbody tr:last-child td { border-bottom: 0; }
        .empty { margin-top: 25px; padding: 25px; border: 2px dashed var(--teal); border-left: 7px solid var(--sun); background: rgba(255,255,255,.82); color: var(--muted); box-shadow: 6px 6px 0 rgba(8,126,139,.1); }
        @media (max-width: 600px) { .topbar { min-height: 68px; padding: 0 6vw; } .brand { font-size: 1.04rem; } .top-actions { gap: 10px; } .top-actions .button { min-height: 41px; padding: 9px 12px; } .page { padding-top: 48px; } h1 { font-size: 2.65rem; } .panel { padding: 22px; } .actions { gap: 11px; } .actions .button { flex: 1 1 145px; } th, td { padding: 12px 14px; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('home') }}">Shelfwise <span aria-hidden="true">/</span> Library</a>
        <nav class="top-actions" aria-label="Main navigation">
            {% if session.get('user_id') %}
                <a href="{{ url_for('dashboard') }}">My library</a>
                <form action="{{ url_for('logout') }}" method="post" style="margin:0"><button class="button secondary" type="submit">Log out</button></form>
            {% elif request.endpoint != 'home' %}
                <a href="{{ url_for('login') }}">Log in</a>
            {% endif %}
        </nav>
    </header>
    <main class="page">
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="flash {{ category }}" role="status">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
